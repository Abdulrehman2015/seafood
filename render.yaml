services:
  - type: web
    name: meijia-seafood
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Meijia International Trading"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
